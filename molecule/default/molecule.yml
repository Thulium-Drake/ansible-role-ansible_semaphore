---
dependency:
  name: 'galaxy'
driver:
  name: ${DRIVER_NAME:-podman}
platforms:
  - name: "semaphore"
    image: "git.element-networks.nl/containers/${MOLECULE_DISTRO:-ubi9}-ansible:latest"
    command: '/lib/systemd/systemd'
    pre_build_image: true
    volumes:
      - '/sys/fs/cgroup:/sys/fs/cgroup:ro'
    privileged: true
provisioner:
  name: 'ansible'
  config_options:
    defaults:
      roles_path: "$MOLECULE_PROJECT_DIRECTORY/.."
verifier:
  name: 'ansible'
